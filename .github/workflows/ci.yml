name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m build
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import clipboard_typer; assert 'site-packages' in clipboard_typer.__file__"
          python -m clipboard_typer --version
          clipboard-typer validate-config "$GITHUB_WORKSPACE/settings.json"
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  windows-exe:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - mode: onefile
            artifact: ClipboardTyper-windows
            output: dist
          - mode: onedir
            artifact: ClipboardTyper-windows-onedir
            output: dist/ClipboardTyper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build desktop executable
        shell: cmd
        run: build_exe.bat --${{ matrix.mode }} --no-pause
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
